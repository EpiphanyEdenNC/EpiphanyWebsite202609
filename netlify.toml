[build]
  command = "npm run build"
  publish = "dist"
  # Tina saves currently use the commit message "TinaCMS content update".
  # Skip those automatic Git-triggered builds. Netlify build-hook deploys
  # bypass this ignore command, so Publish Website still triggers a build.
  ignore = "test \"$(git log -1 --pretty=%B)\" = \"TinaCMS content update\""

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
