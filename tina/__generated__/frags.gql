fragment SiteParts on Site {
  __typename
  churchName
  tagline
  address
  phone
  email
  sundayTime
  facebookUrl
  youtubeUrl
  givingUrl
  mailingListUrl
  footerNote
  seoDescription
}

fragment HomeParts on Home {
  __typename
  headline
  eyebrow
  subheadline
  heroImage
  primaryButtonLabel
  primaryButtonUrl
  secondaryButtonLabel
  secondaryButtonUrl
  welcomeHeading
  welcomeText
  serviceHeading
  serviceText
  serviceButtonLabel
  serviceButtonUrl
  outreachHeading
  outreachText
  outreachButtonLabel
  outreachButtonUrl
  closingHeading
  closingText
}

fragment PageParts on Page {
  __typename
  title
  eyebrow
  intro
  sections {
    __typename
    heading
    anchor
    text
  }
}

fragment EventParts on Event {
  __typename
  title
  slug
  date
  time
  location
  summary
  details
  image
  featured
  buttonLabel
  buttonUrl
}

fragment MinistryParts on Ministry {
  __typename
  title
  summary
  description
  image
  featured
  sortOrder
}
